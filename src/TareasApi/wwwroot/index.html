<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taller GitHub Actions .NET · Tareas</title>
  <style>
    :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --accent:#5b4bd6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#222220; --ink:#ededea; --muted:#a3a39d; --accent:#a99cff; } }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:640px; margin:40px auto; padding:0 16px; }
    .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; }
    h1 { font-size:1.5rem; margin:0 0 4px; }
    .muted { color:var(--muted); font-size:.9rem; }
    ul { list-style:none; padding:0; margin:0; }
    li { padding:8px 0; border-bottom:1px solid rgba(127,127,127,.15); }
    li.hecha { color:var(--muted); text-decoration:line-through; }
    form { display:flex; gap:8px; margin-top:12px; }
    input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid rgba(127,127,127,.4); background:transparent; color:inherit; }
    button { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Tareas del taller .NET</h1>
    <div class="muted">API ASP.NET Core desplegada con GitHub Actions</div>
    <div class="muted" id="version">Consultando versión…</div>
  </div>
  <div class="card">
    <ul id="lista"></ul>
    <form id="form">
      <input id="titulo" placeholder="Nueva tarea" required>
      <button>Agregar</button>
    </form>
  </div>
</main>
<script>
  const lista = document.getElementById('lista');

  function pintar(tareas) {
    lista.innerHTML = '';
    tareas.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t.titulo;
      if (t.hecha) li.className = 'hecha';
      lista.appendChild(li);
    });
  }

  async function cargar() {
    const v = await (await fetch('/api/version')).json();
    document.getElementById('version').textContent = 'versión ' + v.version + ' · commit ' + v.commit.slice(0, 7);
    pintar(await (await fetch('/api/tareas')).json());
  }

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const titulo = document.getElementById('titulo').value.trim();
    if (!titulo) return;
    await fetch('/api/tareas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titulo }) });
    e.target.reset();
    cargar();
  });

  cargar();
</script>
</body>
</html>
