name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml     # workflow reutilizable
    permissions:
      contents: read
      actions: read
      checks: write

  publish-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gha-taller-dotnet
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: publish-image
    uses: ./.github/workflows/deploy-render.yml
    with:
      image-digest: ${{ needs.publish-image.outputs.digest }}
      expected-version: ${{ needs.publish-image.outputs.version }}
      environment: production            # aquí se pide la aprobación manual
    secrets: inherit

  github-release:
    needs: [publish-image, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write                    # crear el release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publicar binarios con la versión
        env:
          VERSION: ${{ needs.publish-image.outputs.version }}
        run: |
          dotnet publish src/TareasApi/TareasApi.csproj -c Release \
            -p:Version="$VERSION" -o publish
          cd publish && zip -r "../gha-taller-dotnet-$VERSION.zip" .

      - name: Crear GitHub Release con el zip adjunto
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish-image.outputs.version }}
          APP_URL: ${{ vars.RENDER_URL }}
        run: |
          gh release create "$TAG" "gha-taller-dotnet-$VERSION.zip" \
            --repo "$REPO" --title "$TAG" --generate-notes \
            --notes "Imagen: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gha-taller-dotnet:${VERSION}\` · En producción: ${APP_URL}"
